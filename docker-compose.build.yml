# 从源码构建时使用：
#   docker compose -f docker-compose.build.yml up -d --build
services:
  xiaomi-token-monitor:
    build: .
    image: xiaomi-token-monitor:local
    container_name: xiaomi-token-monitor
    restart: unless-stopped
    ports:
      - "9990:9990"
    environment:
      PORT: "9990"
      HOST: "0.0.0.0"
      DATA_DIR: /data
    volumes:
      - xiaomi-token-data:/data

volumes:
  xiaomi-token-data:
